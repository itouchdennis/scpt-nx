# Recompiler input for Offline.xbe (Splinter Cell: Pandora Tomorrow, original Xbox, title 55530019): the
# campaign, which the disc's default.xbe (a launcher) starts. XDK 1.0.5788. The XDK library functions and data
# were found from Chaos Theory's sc3.xbe: by the XDK's own .XTLID ids, masked signatures with their neighbours,
# the call graph, and instruction similarity; 0 where none was found (the host leaves those alone).
includes = ["xdk_symbols_scpt.toml"]
[xbe]
path = "assets/Offline.xbe"
out = "generated/game"
library = "SCPT.dll"  # <exe>.dll, which the executable delay loads
partitions = 128
code_sections = [".text", "XNET", "XONLINE", "D3D", "D3DX", "XGRPH", "DSOUND", "XPP",
    "BINK", "BINK32", "BINK32A", "BINK16", "BINK4444", "BINK5551", "BINKYUY2",
    "BINK16MX", "BINK16X2", "BINK16M", "BINK32MX", "BINK32X2", "BINK32M"]

[functions]

# functions the host replaces or calls by name, 0 where the image has none
